name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — TypeScript + build
# No database needed. Runs on every push/PR.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + all artifacts)
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build admin (CI static mode, base = /)
        run: pnpm --filter @workspace/admin run build
        env:
          PORT: "3001"          # vite.config.ts requires PORT even for build
          BASE_PATH: "/"

      # Upload built admin so E2E job can download it without rebuilding
      - uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: artifacts/admin/dist/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: artifacts/api-server/dist/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — Unit / integration tests (Vitest, no database)
# ─────────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck-build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test
        env:
          NODE_ENV: test
          # Unit tests that touch the DB use a mock; those that don't are fine without.
          DATABASE_URL: ""

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — Migration dry-run (schema validation)
# Spins up a clean Postgres, runs every migration, verifies schema compiles.
# ─────────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    needs: typecheck-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://daybook:daybook@localhost:5432/daybook_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib/db
        run: npx tsc -b lib/db

      - name: Run the deployment migration entry point
        run: |
          pnpm --filter @workspace/db run migrate
          node lib/db/migrate-email.mjs
          node lib/db/migrate-orders.mjs
          node lib/db/migrate-support-v2.mjs
          pnpm --filter @workspace/scripts run migrate-releases
          pnpm --filter @workspace/scripts run migrate-release-github-review
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify tracked ledger and WorldSmith API tables
        run: pnpm --filter @workspace/db run verify-migration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Confirm the tracked migration is a no-op when repeated
        run: |
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | sed -E '/^\\(un)?restrict /d' > /tmp/schema-before-rerun.sql
          psql "$DATABASE_URL" -Atc 'SELECT hash, created_at FROM drizzle.__drizzle_migrations ORDER BY id' > /tmp/ledger-before-rerun.txt

          pnpm --filter @workspace/db run migrate

          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | sed -E '/^\\(un)?restrict /d' > /tmp/schema-after-rerun.sql
          psql "$DATABASE_URL" -Atc 'SELECT hash, created_at FROM drizzle.__drizzle_migrations ORDER BY id' > /tmp/ledger-after-rerun.txt
          cmp /tmp/schema-before-rerun.sql /tmp/schema-after-rerun.sql
          cmp /tmp/ledger-before-rerun.txt /tmp/ledger-after-rerun.txt
          pnpm --filter @workspace/db run verify-migration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify core tables exist
        run: |
          psql "$DATABASE_URL" -c "\dt" | grep -E "orders|tickets|email_configs"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify legacy migration baselines are safe
        run: |
          BASELINE_URL="${DATABASE_URL%/daybook_ci}/daybook_legacy_base"
          PUSHED_URL="${DATABASE_URL%/daybook_ci}/daybook_legacy_pushed"
          PARTIAL_URL="${DATABASE_URL%/daybook_ci}/daybook_partial"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE daybook_legacy_base'
          psql "$BASELINE_URL" -v ON_ERROR_STOP=1 -f lib/db/drizzle/0000_verify-canon-relation-primary-key.sql
          DATABASE_URL="$BASELINE_URL" pnpm --filter @workspace/db run migrate
          DATABASE_URL="$BASELINE_URL" pnpm --filter @workspace/db run verify-migration

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE daybook_legacy_pushed'
          for migration in lib/db/drizzle/*.sql; do psql "$PUSHED_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
          DATABASE_URL="$PUSHED_URL" pnpm --filter @workspace/db run migrate
          DATABASE_URL="$PUSHED_URL" pnpm --filter @workspace/db run verify-migration
          DATABASE_URL="$PUSHED_URL" pnpm --filter @workspace/db run migrate

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE daybook_partial'
          psql "$PARTIAL_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE users (id text PRIMARY KEY)'
          if DATABASE_URL="$PARTIAL_URL" pnpm --filter @workspace/db run migrate 2>partial-migration.err; then
            echo "Expected a partial pre-ledger schema to be rejected" >&2
            exit 1
          fi
          grep -q 'Cannot safely baseline this database' partial-migration.err
          psql "$PARTIAL_URL" -Atc "SELECT to_regclass('drizzle.__drizzle_migrations') IS NULL" | grep -qx 't'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 — Playwright end-to-end tests
# Spins up the full stack (Postgres + API + admin SPA) and runs browser tests.
# ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck-build, migrations]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://daybook:daybook@localhost:5432/daybook_ci
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test
      # API server will also serve the admin SPA at /
      SERVE_ADMIN_DIST: artifacts/admin/dist/public
      PORT: "3001"
      APP_URL: "http://localhost:3001"
      # Optional: override to test against a deployed staging URL instead
      PLAYWRIGHT_BASE_URL: "http://localhost:3001"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: artifacts/admin/dist/

      - uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: artifacts/api-server/dist/

      - name: Build lib/db
        run: npx tsc -b lib/db

      - name: Run deployment migrations
        run: |
          pnpm --filter @workspace/db run migrate
          node lib/db/migrate-email.mjs
          node lib/db/migrate-orders.mjs
          node lib/db/migrate-support-v2.mjs
          pnpm --filter @workspace/scripts run migrate-releases
          pnpm --filter @workspace/scripts run migrate-release-github-review

      - name: Seed full dev data
        run: pnpm --filter @workspace/scripts run seed

      - name: Seed CI test personas
        run: pnpm --filter @workspace/scripts run seed:ci

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter @workspace/e2e exec playwright install --with-deps chromium

      - name: Start API server (+ admin SPA via SERVE_ADMIN_DIST)
        run: |
          node --enable-source-maps artifacts/api-server/dist/index.mjs &
          echo $! > /tmp/server.pid
        env:
          PORT: "3001"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          NODE_ENV: test
          SERVE_ADMIN_DIST: ${{ env.SERVE_ADMIN_DIST }}

      - name: Wait for server
        run: npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: Run Playwright tests
        run: pnpm --filter @workspace/e2e run test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test traces (failures only)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 3
